name: refresh-data
permissions:
  contents: write

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 5 minutes - data + line chart only
    - cron: '0 3 * * *'     # Daily at 3am UTC - all charts
    - cron: '0 0 1 * *'     # Monthly on 1st - includes RMSEs
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # On ABS release days the rapid-update workflow (rapid-update.yaml) owns
  # publishing between 10:40 and 11:45 Melbourne time. Scheduled regular runs
  # in that window are skipped so they cannot delay or displace it; the next
  # regular run afterwards performs the full pipeline as usual.
  rapid-window:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      in_window: ${{ steps.window.outputs.in_window }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            R/abs_release_calendar.R
            R/line_chart.R
            combined_data/abs_release_calendar.csv
      - uses: r-lib/actions/setup-r@v2
      - id: window
        run: Rscript R/abs_release_calendar.R window --from 10:40 --to 11:45

  refresh-data:
    needs: rapid-window
    # Runs for every event as before (rapid-window is skipped for non-schedule
    # events, and a gate failure never blocks the regular pipeline).
    if: ${{ !cancelled() && needs.rapid-window.outputs.in_window != 'true' }}
    runs-on: macos-latest
    # Shared with rapid-update.yaml so regular and rapid runs never write to
    # the repository at the same time (queued runs wait, never cancelled).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'cash-rate-publish' }}
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install XQuartz on macOS
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      # R packages are cached and refreshed weekly (new key each ISO week, no
      # fallback key) instead of being reinstalled on every run.
      - name: Weekly package cache key
        id: rcache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: refresh-${{ runner.os }}-${{ runner.arch }}-${{ steps.rcache.outputs.week }}-${{ hashFiles('.github/workflows/refresh-data.yaml') }}

      - name: Install packages (only those missing from the cache)
        run: Rscript -e 'pk <- c("vctrs","tidyverse","here","jsonlite","ggrepel","viridis","conflicted","tidyr","scales","readabs","readrba","plotly","purrr","cachem","dplyr","ggpattern","ggtext","zoo","vroom"); miss <- pk[!pk %in% rownames(installed.packages())]; if (length(miss)) install.packages(miss)'

      # ── Always: scrape data ────────────────────────────────────────────
      - name: Get data
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # Full rebuild from every daily CSV on the daily run, pushes and manual
          # runs; the frequent runs append only the new snapshot (same result).
          FULL_REBUILD: ${{ (github.event_name != 'schedule' || github.event.schedule == '0 3 * * *') && '1' || '' }}
        run: Rscript -e 'source(here::here("R","scrape_cash_rate.R"), echo = TRUE)'

      # ── Daily: maintain the ABS release calendar used by rapid updates ──
      - name: Refresh ABS release calendar
        continue-on-error: true
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') }}
        run: Rscript R/abs_release_calendar.R refresh

         # ── Monthly + push: RMSEs ──────────────────────────────────────────
      - name: Calculate RMSEs
        continue-on-error: true
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *') }}
        run: Rscript -e 'source(here::here("R","rmse.R"), echo = TRUE)'

      # ── Always: line chart ─────────────────────────────────────────────
      - name: Make line graph
        if: ${{ github.event_name != 'pull_request' }}
        run: Rscript -e 'source(here::here("R","line_chart.R"), echo = TRUE)'

      # ── Daily + monthly + push: all other charts ───────────────────────
      - name: Make multi-meeting line graphs
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","future_meeting_line_charts.R"), echo = TRUE)'

      - name: Make heatmaps graph
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","heat_maps.R"), echo = TRUE)'

      - name: Make actual vs implied graph
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","actual_vs_implied.R"), echo = TRUE)'

      - name: Build ASX volatility analysis and figures
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","asx_volatility_pipeline.R"), echo = TRUE)'


     

      # ── Always: rebuild index and commit ──────────────────────────────
      - name: Generate index.html from charts
        if: ${{ github.event_name != 'pull_request' }}
        run: Rscript R/write_index_html.R

      - name: Commit
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global user.name 'igross'
          git add .
          git commit -m 'refreshing data' || echo "No changes to commit"
          git push || echo "No changes to commit"
