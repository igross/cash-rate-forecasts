name: refresh-data
permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes - data + line chart only
    - cron: '0 3 * * *'     # Daily at 3am UTC - all charts
    - cron: '0 0 1 * *'     # Monthly on 1st - includes RMSEs
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-${{ hashFiles('.github/workflows/refresh-data.yaml') }}
          restore-keys: |
            r-packages-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libgdal-dev

      - name: Install packages
        run: |
          Rscript -e '
            pkgs <- c("vctrs","tidyverse","here","jsonlite","ggrepel","viridis",
                       "conflicted","tidyr","scales","readabs","readrba","plotly",
                       "purrr","cachem","dplyr","ggpattern","ggtext","zoo","vroom")
            new_pkgs <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
            if (length(new_pkgs) > 0) install.packages(new_pkgs)
          '

      # ── Always: scrape data ────────────────────────────────────────────
      - name: Get data
        run: Rscript -e 'source(here::here("R","scrape_cash_rate.R"), echo = TRUE)'

      # ── Always: line chart ─────────────────────────────────────────────
      - name: Make line graph
        run: Rscript -e 'source(here::here("R","line_chart.R"), echo = TRUE)'

      # ── Daily + monthly + push: all other charts ───────────────────────
      - name: Make multi-meeting line graphs
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","future_meeting_line_charts.R"), echo = TRUE)'

      - name: Make heatmaps graph
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","heat_maps.R"), echo = TRUE)'

      - name: Make actual vs implied graph
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') }}
        run: Rscript -e 'source(here::here("R","actual_vs_implied.R"), echo = TRUE)'

      # ── Monthly + push: RMSEs ──────────────────────────────────────────
      - name: Calculate RMSEs
        continue-on-error: true
        if: |
          ${{ github.event_name == 'push' ||
              (github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *') }}
        run: Rscript -e 'source(here::here("R","rmse.R"), echo = TRUE)'

      # ── Always: rebuild index and commit ──────────────────────────────
      - name: Generate index.html from charts
        run: Rscript R/write_index_html.R

      - name: Commit
        run: |
          git config --global user.name 'igross'
          git add .
          git commit -m 'refreshing data' || echo "No changes to commit"
          git push || echo "No changes to commit"
