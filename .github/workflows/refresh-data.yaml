name: refresh-data

permissions:
  contents: write

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
    # Once a month at midnight on the 1st
    - cron: '0 0 1 * *'
    # 11:31 AM AEST (01:31 UTC) - data and line chart only
    - cron: '31 1 * * *'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install XQuartz on macOS
        if: runner.os == 'macOS'
        run: brew install xquartz --cask
      - name: Install pak
        run: Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - name: Install packages
        run: |
          Rscript -e '
            options(
              pkg.type = "source",
              pkgType = "source",
              install.packages.compile.from.source = "always"
            )
            pak::pkg_install(c(
              "stringi", "tidyverse", "here", "rprojroot", "jsonlite",
              "ggrepel", "viridis", "conflicted", "tidyr", "scales",
              "readabs", "readrba", "plotly", "purrr", "cachem",
              "dplyr", "ggpattern", "ggtext", "zoo", "vroom",
              "bit", "bit64", "xfun", "backports"
            ), dependencies = TRUE)
          '
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/*.R') }}
          restore-keys: |
            ${{ runner.os }}-r-
      # Run RMSEs on push OR monthly (1st at midnight)
      - name: Calculate RMSEs (push or monthly)
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: Rscript -e 'source("R/rmse.R", echo = TRUE)'

      - name: Get data
        run: Rscript -e 'source("R/scrape_cash_rate.R", echo = TRUE)'

      - name: Make line graph
        continue-on-error: true
        run: Rscript -e 'source("R/line_chart.R", echo = TRUE)'

      - name: Make forecast paths graph
        continue-on-error: true
        run: Rscript -e 'source("R/actual_vs_implied.R", echo = TRUE)'

      - name: Generate index.html from charts
        continue-on-error: true
        run: Rscript R/write_index_html.R

      - name: Commit
        run: |
          git config --global user.name 'igross'
          git config --global user.email 'igross@users.noreply.github.com'
          git add .
          git add docs/*.png docs/index.html
          git commit -m 'refreshing data' || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || echo "No changes to commit"
